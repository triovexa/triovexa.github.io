<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Grid UI - TRIOVEXA Tech Stack</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="ui-container">
    <!-- Top 'Learn more' link -->
    <a href="#" class="learn-more">Learn more &rarr;</a>

    <!-- Grid Wrapper with Fade Effect -->
    <div class="grid-wrapper">
      <div class="app-grid">
        
        <!-- Row 1 -->
        <div class="app-card">
          <div class="icon">👥</div>
          <span class="app-name">Zoho Social</span>
        </div>
        <div class="app-card">
          <div class="icon" style="color: #e60000;">🎯</div>
          <span class="app-name">Zoho SalesIQ</span>
        </div>
        <div class="app-card">
          <div class="icon" style="color: #00b300;">🎧</div>
          <span class="app-name">Zoho Desk</span>
        </div>
        <div class="app-card">
          <div class="icon">📊</div>
          <span class="app-name">Zoho Projects</span>
        </div>

        <!-- Row 2 -->
        <div class="app-card">
          <div class="icon" style="color: #0066cc;">🔗</div>
          <span class="app-name">Zoho CRM</span>
        </div>
        <div class="app-card">
          <div class="icon" style="color: #009933;">📱</div>
          <span class="app-name">Radar - Desk</span>
        </div>
        <div class="app-card">
          <div class="icon" style="color: #0066cc;">🤝</div>
          <span class="app-name">CRM Analytics</span>
        </div>
        <div class="app-card">
          <div class="icon" style="color: #cc0000;">📈</div>
          <span class="app-name">Zoho Analytics</span>
        </div>
        <div class="app-card">
          <div class="icon">📋</div>
          <span class="app-name">Zoho Survey</span>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
